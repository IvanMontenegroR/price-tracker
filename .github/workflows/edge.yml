name: Edge function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "lib/**"
      - ".github/workflows/edge.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: no la llama un usuario con sesión, la llama pg_cron.
      # La autorización es el secreto en la cabecera que valida la función.
      - run: supabase functions deploy recolectar --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
